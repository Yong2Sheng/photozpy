name: photozpy_dev
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip

  # --- core scientific stack (allow patch/minor updates, avoid major breaks) ---
  - numpy>=1.26,<2
  - pandas>=2.2,<3
  - scipy>=1.13,<2
  - matplotlib>=3.9,<4

  # --- astronomy ---
  - astropy>=6,<7
  - ccdproc>=2.4,<3
  - photutils>=1.11,<2
  - astroquery>=0.4.7,<0.5
  - regions>=0.8,<1
  - astroalign>=2.5,<3
  - astropy-healpix>=1.0.3,<2
  - pytables

  # --- standard star metadata visualization ---
  - tabulate

  # --- your pipeline deps ---
  - swifttools>=3.0,<4
  - boto3 # dependency for swifttools. It needs manual installation
  - tqdm
  - chardet

  # --- notebook runtime ---
  - jupyterlab>=4,<5
  - ipywidgets>=8,<9
  - ipykernel>=6,<7

  # dev/test tools (conda installs them; pip won't touch deps)
  - pytest>=8,<9
  - pytest-cov>=5,<6
  - coverage>=7,<8
  - ruff>=0.5,<1
  - black>=24,<25
  - mypy>=1.8,<2
  - pre-commit>=3.6,<4

  # --- DS9 / XPA interaction ---
  - xpa