# codecov.yml
# This file configures Codecov's behavior (separate from .coveragerc).
# It controls PR status checks and the PR comment content/thresholds.

coverage:
  status:
    project:                     # overall (repo-wide) coverage gate
      default:
        target: auto             # compare to base commit automatically (no regression)
        threshold: 10%            # allow small drop (e.g., ≤2 pp) and still pass
    patch:                       # coverage on lines changed in THIS PR (delta coverage)
      default:
        target: 100%              # require >= 80% of changed lines to be covered
        threshold: 50%            # no slack on delta gate (tighten as you like)

comment:
  layout: "reach, diff, files"   # include useful sections in the PR comment
  hide_project_coverage: false   # show both project and delta coverage in the comment
