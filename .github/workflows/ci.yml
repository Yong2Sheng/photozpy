# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Create a conda/mamba environment from environment.yml
      - name: Set up micromamba environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          # keep env name stable regardless of environment.yml's name:
          environment-name: ci
          # optional but recommended: cache env for faster CI
          cache-environment: true
          # make channels explicit (avoid surprises)
          condarc: |
            channels:
              - conda-forge
              - defaults

      # Install your package in editable mode; keep deps managed by conda/mamba
      - name: Install photozpy (editable, no deps)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
        shell: micromamba-shell {0}

      - name: Lint (ruff)
        run: |
          ruff check .
        shell: micromamba-shell {0}

      - name: Run tests with coverage (HTML + XML)
        run: |
          pytest --cov=photozpy \
                 --cov-report=term-missing \
                 --cov-report=xml:coverage.xml \
                 --cov-report=html:tests/coverage_report
        shell: micromamba-shell {0}

      # 把 HTML 覆盖率报告作为工件上传，方便从网页下载浏览
      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: html-coverage
          path: tests/coverage_report
          if-no-files-found: error
          retention-days: 7

      # 上传覆盖率到 Codecov（公有仓库无需 token；私有仓库要在 Secrets 里配置）
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: true
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}
